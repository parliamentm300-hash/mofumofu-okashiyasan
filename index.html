function newExercise(){let types=['coin','sum','change'];let type=types[Math.floor(Math.random()*Math.min(3,1+Math.floor(state.studyDone/3)))];let a,b,answer,question;if(type==='coin'){a=[10,50,100,200,500][Math.floor(Math.random()*5)];question=`${a}えんを つくろう！`;answer=a}else if(type==='sum'){a=[30,50,70,80][Math.floor(Math.random()*4)];b=[10,20,30,50][Math.floor(Math.random()*4)];question=`${a}えん ＋ ${b}えん は？`;answer=a+b}else{a=[100,200,500][Math.floor(Math.random()*3)];b=[30,50,70,80,100][Math.floor(Math.random()*5)];if(b>a)b=30;question=`${a}えん − ${b}えん は？`;answer=a-b}exercise={question,answer,type};paid=0;selection=[]}function study(){if(!exercise)newExercise();main.innerHTML=`<h1 class="heading">🪙 おかねの れんしゅう</h1><div class="card center"><div class="character">${portrait(1)}</div><p>あおまると いっしょに やってみよう！</p><h2>${exercise.question}</h2><div class="status">えらんだ おかね：${paid}えん</div><p class="note">おかねを タップして こたえを つくろう。</p><div class="coinrow">${[10,50,100,500].map(n=>`<button class="money" data-coin="${n}">${n}<small style="font-size:12px">円</small></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="small" id="undo">↩ もどす</button><button class="small" id="reset">やりなおす</button></div><p><button class="primary" id="check">こたえあわせ！</button></p><div class="feedback" id="feedback"></div><button class="secondary" id="hint" style="width:100%">💡 ヒント</button></div>`;document.querySelectorAll('[data-coin]').forEach(b=>b.onclick=()=>{let v=+b.dataset.coin;paid+=v;selection.push(v);study()});document.getElementById('undo').onclick=()=>{paid-=selection.pop()||0;study()};document.getElementById('reset').onclick=()=>{paid=0;selection=[];study()};document.getElementById('hint').onclick=()=>document.getElementById('feedback').textContent='こたえは '+exercise.answer+'えん。おかねを くみあわせてね';document.getElementById('check').onclick=()=>{state.attempts++;if(paid===exercise.answer){state.correct++;state.studyDone++;state.coins+=10;save();sound();toast('せいかい！ 🪙 10コイン ゲット！');newExercise();study()}else{save();sound(false);document.getElementById('feedback').textContent=paid<exercise.answer?'もうすこし おかねを たそう！':'おかねが おおいよ。もどしてみよう！'}}}
function decorate(){main.innerHTML=`<h1 class="heading">🎀 おみせを かざろう</h1><div class="card center"><div class="shelf"><span class="item">🍰</span><span class="item">🍩</span><span class="item">🍮</span></div><div class="decor" style="margin:15px 0">${state.owned.length?state.owned.map(i=>decors[i].emoji).join('　'):'🌼'}</div><p>コインを ためて かざりを ふやそう！</p></div><div class="card"><h2>🍰 しょうひんずかん (${available().length}/30)</h2><div class="catalog">${products.map((p,i)=>'<div class="catalogitem '+(p.tier<=unlocked()?'':'locked')+'"><span>'+ (p.tier<=unlocked()?p.emoji:'🔒')+'</span><small>'+(p.tier<=unlocked()?p.name:'まだ ひみつ')+'</small><b>'+(p.tier<=unlocked()?p.price+'円':'レベル'+(p.tier*2-1))+'</b></div>').join('')}</div></div><div class="card"><h2>かざりの おみせ</h2>${decors.map((d,i)=>`<div class="shopline"><div class="pic">${d.emoji}</div><div class="detail"><strong>${d.name}</strong><div class="muted">🪙 ${d.cost} コイン</div></div><button class="small" data-buy="${i}" ${state.owned.includes(i)||state.coins<d.cost?'disabled':''}>${state.owned.includes(i)?'もってる':state.coins<d.cost?'たりない':'かう！'}</button></div>`).join('')}</div>`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.buy;if(state.owned.includes(i)||state.coins<decors[i].cost)return;state.coins-=decors[i].cost;state.owned.push(i);save();sound();toast(decors[i].name+' を かざったよ！');decorate();header()})}function record(){let accuracy=state.attempts?Math.round(state.correct/state.attempts*100):0;main.innerHTML=`<h1 class="heading">🏅 がんばり きろく</h1><div class="card center"><div class="character">${portrait(4)}</div><h2>いつも ありがとう！</h2><div class="grid"><div class="status">🍰 おきゃくさん<br><strong>${state.served}にん</strong></div><div class="status">🪙 れんしゅう<br><strong>${state.studyDone}かい</strong></div><div class="status">⭐ せいかい<br><strong>${state.correct}かい</strong></div><div class="status">🎀 かざり<br><strong>${state.owned.length}こ</strong></div></div><h3>せいかいりつ ${accuracy}%</h3><div class="progress"><div style="width:${accuracy}%"></div></div><p class="note">まちがえても だいじょうぶ。すこしずつ おぼえよう！</p></div><div class="card"><h3>おうちの ひとへ</h3><p class="note">このゲームのきろくは、この端末のブラウザに保存されます。ブラウザのデータ削除などで消える場合があります。</p><button class="small" id="wipe">きろくを はじめからに する</button></div>`;document.getElementById('wipe').onclick=()=>{if(confirm('ほんとうに きろくを けしますか？ おうちの ひとと かくにんしてね。')){state={...defaults};order=null;exercise=null;save();render()}}}document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>change(b.dataset.page)));document.getElementById('sound').onclick=()=>{state.sound=!state.sound;save();header()};render()})();
</script><script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
