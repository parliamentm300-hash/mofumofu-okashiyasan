<style>
/* Ver.4 visual polish */
:root{--berry:#d86e92;--cream:#fff7e9}
body{background:radial-gradient(circle at 10% 5%,#ffe0ed,transparent 34%),#fff7ef}

.heading{letter-spacing:.04em;text-shadow:0 2px 0 white}
.card{box-shadow:0 6px 0 #f4e0e0,0 12px 25px #eabfc225}

.shelf:before{content:"✿  SWEET SHOP  ✿";position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:10px;color:#b17d7d;letter-spacing:1px;white-space:nowrap}

.portrait{box-shadow:0 4px 8px #e4bdc044;transition:transform .2s}
.character .portrait{animation:mascotHello 2.8s ease-in-out infinite}

.shopline .treat-art{width:54px;height:54px}

function serve(){if(!order)newOrder();let g=order.guest;let common=`<h1 class="heading">🍰 おかしやさん</h1><div class="card center">${guestScene()}<div class="status" style="margin-top:10px">${order.picks.map(i=>products[i].emoji+' '+products[i].name).join(' ＋ ')}</div></div>`;if(stage==='choose'){main.innerHTML=common+`<div class="card"><h2>① おかしを えらぼう</h2><p>たのまれた おかしを ぜんぶ えらんでね。</p><div class="choose-actions"><div class="status">えらんだ おかし：${selection.length}こ</div><button class="primary" id="confirm">これで OK！</button><div class="feedback" id="feedback"></div></div><div class="grid choose-grid">${products.map((p,i)=>({p,i})).filter(({p})=>p.tier<=unlocked()).map(({p,i})=>`<button class="product ${selection.includes(i)?'selected':''}" data-pick="${i}"><div class="emoji">${treatArt(i)}</div>${p.name}<div>${fmt(p.price)}</div></button>` ).join('')}</div></div>`;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let i=+b.dataset.pick;selection=selection.includes(i)?selection.filter(x=>x!==i):[...selection,i];serve()});document.getElementById('confirm').onclick=()=>{if(selection.length===order.picks.length&&selection.every(i=>order.picks.includes(i))){stage='pay';sound();serve();window.scrollTo(0,0)}else{sound(false);document.getElementById('feedback').textContent='ちがうみたい。おきゃくさんの ちゅうもんを みてね！'}};return}if(stage==='pay'){main.innerHTML=common+`<div class="card"><h2>② ごうけいは いくら？</h2><p>${order.picks.map(i=>products[i].price+'えん').join(' ＋ ')} ＝ ？</p><div class="coinrow">${[order.total,order.total+10,Math.max(10,order.total-10)].sort(()=>Math.random()-.5).map((n,i)=>`<button class="secondary" data-total="${n}">${n}えん</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="small" id="hint" style="width:100%">💡 ヒントを みる</button></div>`;document.querySelectorAll('[data-total]').forEach(b=>b.onclick=()=>{state.attempts++;if(+b.dataset.total===order.total){state.correct++;save();stage='change';paid=0;selection=[];sound();serve();window.scrollTo(0,0)}else{save();sound(false);document.getElementById('feedback').textContent='おしい！ もういちど かんがえてみよう'}});document.getElementById('hint').onclick=()=>document.getElementById('feedback').textContent=order.picks.map(i=>products[i].price).join(' ＋ ')+' ＝ '+order.total+'えん';return}if(stage==='change'){let changeDue=order.received-order.total;main.innerHTML=common+`<div class="card"><h2>③ おつりを わたそう</h2><p class="center">おかしは <strong>${order.total}えん</strong><br>おきゃくさんから <strong>${order.received}えん</strong> もらったよ。</p><div class="status">おつりは いくら？<br><span style="font-size:13px">10・50・100えんを タップ！</span></div><p class="center" style="font-size:25px;font-weight:900">${paid}えん</p><div class="coinrow">${[10,50,100].map(n=>`<button class="money" data-coin="${n}" aria-label="${n}円を足す">${n}<small style="font-size:12px">円</small></button>`).join('')}</div><div class="row" style="margin-top:15px"><button class="small" id="undo">↩ ひとつ もどす</button><button class="small" id="reset">やりなおす</button></div><p><button class="primary" id="check">おつりを わたす！</button></p><div class="feedback" id="feedback"></div><button class="secondary" style="width:100%" id="hint">💡 ヒント</button></div>`;document.querySelectorAll('[data-coin]').forEach(b=>b.onclick=()=>{selection.push(+b.dataset.coin);paid+=+b.dataset.coin;serve()});document.getElementById('undo').onclick=()=>{paid-=selection.pop()||0;serve()};document.getElementById('reset').onclick=()=>{selection=[];paid=0;serve()};document.getElementById('hint').onclick=()=>document.getElementById('feedback').textContent=order.received+' − '+order.total+' ＝ '+changeDue+'えん';document.getElementById('check').onclick=()=>{state.attempts++;if(paid===changeDue){state.correct++;state.served++;state.coins+=20+order.picks.length*10;save();stage='done';sound();serve();window.scrollTo(0,0)}else{save();sound(false);document.getElementById('feedback').textContent=paid<changeDue?'あと '+(changeDue-paid)+'えん たりないよ！':'おつりが おおいよ。すこし もどそう！'}};return}main.innerHTML=common+`<div class="card center"><div class="big">🎉 ⭐ 🎉</div><h2>だいせいかい！</h2><p>おきゃくさんが にっこり！</p><div class="status">🪙 ${20+order.picks.length*10} コイン ゲット！</div><p>コインで おみせを かざれるよ。</p><button class="primary" id="next">つぎの おきゃくさん</button><p><button class="secondary" id="decor">🎀 おみせを かざる</button></p></div>`;document.getElementById('next').onclick=()=>{newOrder();serve()};document.getElementById('decor').onclick=()=>change('decorate')}
function newExercise(){let types=['coin','sum','change'];let type=types[Math.floor(Math.random()*Math.min(3,1+Math.floor(state.studyDone/3)))];let a,b,answer,question;if(type==='coin'){a=[10,50,100,200,500][Math.floor(Math.random()*5)];question=`${a}えんを つくろう！`;answer=a}else if(type==='sum'){a=[30,50,70,80][Math.floor(Math.random()*4)];b=[10,20,30,50][Math.floor(Math.random()*4)];question=`${a}えん ＋ ${b}えん は？`;answer=a+b}else{a=[100,200,500][Math.floor(Math.random()*3)];b=[30,50,70,80,100][Math.floor(Math.random()*5)];if(b>a)b=30;question=`${a}えん − ${b}えん は？`;answer=a-b}exercise={question,answer,type};paid=0;selection=[]}function study(){if(!exercise)newExercise();main.innerHTML=`<h1 class="heading">🪙 おかねの れんしゅう</h1><div class="card center"><div class="character">${portrait(1)}</div><p>あおまると いっしょに やってみよう！</p><h2>${exercise.question}</h2><div class="status">えらんだ おかね：${paid}えん</div><p class="note">おかねを タップして こたえを つくろう。</p><div class="coinrow">${[10,50,100,500].map(n=>`<button class="money" data-coin="${n}">${n}<small style="font-size:12px">円</small></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="small" id="undo">↩ もどす</button><button class="small" id="reset">やりなおす</button></div><p><button class="primary" id="check">こたえあわせ！</button></p><div class="feedback" id="feedback"></div><button class="secondary" id="hint" style="width:100%">💡 ヒント</button></div>`;document.querySelectorAll('[data-coin]').forEach(b=>b.onclick=()=>{let v=+b.dataset.coin;paid+=v;selection.push(v);study()});document.getElementById('undo').onclick=()=>{paid-=selection.pop()||0;study()};document.getElementById('reset').onclick=()=>{paid=0;selection=[];study()};document.getElementById('hint').onclick=()=>document.getElementById('feedback').textContent='こたえは '+exercise.answer+'えん。おかねを くみあわせてね';document.getElementById('check').onclick=()=>{state.attempts++;if(paid===exercise.answer){state.correct++;state.studyDone++;state.coins+=10;save();sound();toast('せいかい！ 🪙 10コイン ゲット！');newExercise();study()}else{save();sound(false);document.getElementById('feedback').textContent=paid<exercise.answer?'もうすこし おかねを たそう！':'おかねが おおいよ。もどしてみよう！'}}}
function decorate(){main.innerHTML=`<h1 class="heading">🎀 おみせを かざろう</h1><div class="card center"><div class="shelf"><span class="item">🍰</span><span class="item">🍩</span><span class="item">🍮</span></div><div class="decor" style="margin:15px 0">${state.owned.length?state.owned.map(i=>decors[i].emoji).join('　'):'🌼'}</div><p>コインを ためて かざりを ふやそう！</p></div><div class="card"><h2>🍰 しょうひんずかん (${available().length}/30)</h2><div class="catalog">${products.map((p,i)=>'<div class="catalogitem '+(p.tier<=unlocked()?'':'locked')+'"><span>'+ (p.tier<=unlocked()?p.emoji:'🔒')+'</span><small>'+(p.tier<=unlocked()?p.name:'まだ ひみつ')+'</small><b>'+(p.tier<=unlocked()?p.price+'円':'レベル'+(p.tier*2-1))+'</b></div>').join('')}</div></div><div class="card"><h2>かざりの おみせ</h2>${decors.map((d,i)=>`<div class="shopline"><div class="pic">${d.emoji}</div><div class="detail"><strong>${d.name}</strong><div class="muted">🪙 ${d.cost} コイン</div></div><button class="small" data-buy="${i}" ${state.owned.includes(i)||state.coins<d.cost?'disabled':''}>${state.owned.includes(i)?'もってる':state.coins<d.cost?'たりない':'かう！'}</button></div>`).join('')}</div>`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.buy;if(state.owned.includes(i)||state.coins<decors[i].cost)return;state.coins-=decors[i].cost;state.owned.push(i);save();sound();toast(decors[i].name+' を かざったよ！');decorate();header()})}function record(){let accuracy=state.attempts?Math.round(state.correct/state.attempts*100):0;main.innerHTML=`<h1 class="heading">🏅 がんばり きろく</h1><div class="card center"><div class="character">${portrait(4)}</div><h2>いつも ありがとう！</h2><div class="grid"><div class="status">🍰 おきゃくさん<br><strong>${state.served}にん</strong></div><div class="status">🪙 れんしゅう<br><strong>${state.studyDone}かい</strong></div><div class="status">⭐ せいかい<br><strong>${state.correct}かい</strong></div><div class="status">🎀 かざり<br><strong>${state.owned.length}こ</strong></div></div><h3>せいかいりつ ${accuracy}%</h3><div class="progress"><div style="width:${accuracy}%"></div></div><p class="note">まちがえても だいじょうぶ。すこしずつ おぼえよう！</p></div><div class="card"><h3>おうちの ひとへ</h3><p class="note">このゲームのきろくは、この端末のブラウザに保存されます。ブラウザのデータ削除などで消える場合があります。</p><button class="small" id="wipe">きろくを はじめからに する</button></div>`;document.getElementById('wipe').onclick=()=>{if(confirm('ほんとうに きろくを けしますか？ おうちの ひとと かくにんしてね。')){state={...defaults};order=null;exercise=null;save();render()}}}document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>change(b.dataset.page)));document.getElementById('sound').onclick=()=>{state.sound=!state.sound;save();header()};render()})();
</script></body></html>
